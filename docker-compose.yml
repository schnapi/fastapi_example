x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.service"

x-healthcheck-curl: &healthcheck-curl
  interval: 60s
  timeout: 3s
  retries: 3
  start_period: 30s

x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
    # - seccomp=default
    # - apparmor=docker-default

services:
  db:
    image: postgres:18.3
    mem_limit: 768m
    cpus: 1.0
    environment:
      PGOPTIONS: >
        -c log_min_messages=warning
        -c log_min_error_statement=warning
    command: >
      postgres
      -c logging_collector=off
      -c log_destination=jsonlog
      -c log_line_prefix=''
    restart: unless-stopped
    logging: *default-logging
    <<: *security-defaults
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      <<: *healthcheck-curl
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]

  api:
    build: .
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    command: >
      sh -c "
      until pg_isready -h db -U $POSTGRES_USER; do
        echo 'Waiting for database...';
        sleep 2;
      done;
      gunicorn -k uvicorn.workers.UvicornWorker app.main:app
      -w ${WEB_CONCURRENCY:-2}
      -b 0.0.0.0:8000
      --proxy-headers --forwarded-allow-ips=\"*\"
      --access-logfile - --error-logfile -"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - internal
      - observability
    logging: *default-logging
    <<: *security-defaults
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      <<: *healthcheck-curl
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - internal
    profiles: ["dev"]
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    working_dir: /app
    logging: *default-logging
    <<: *security-defaults


  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./data/GeoLite2-Country.mmdb:/etc/nginx/GeoLite2-Country.mmdb:ro
      - frontend_dist:/app/frontend:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - internal
      - public
    healthcheck:
      <<: *healthcheck-curl
      test: ["CMD", "curl", "-f", "http://localhost/health"]
    logging: *default-logging
    <<: *security-defaults

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    mem_limit: 64m
    cpus: 0.25
    command:
      - -nginx.scrape-uri=http://nginx:80/nginx_status
    depends_on:
      - nginx
    networks:
      - internal
      - observability
    logging: *default-logging
    <<: *security-defaults
    cap_drop:
      - ALL

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-admin@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-ChangeMe123!}
      - ZO_DATA_DIR=/data
    volumes:
      - o2_data:/data
    networks:
      - observability
    logging: *default-logging
    <<: *security-defaults

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - O2_AUTH_TOKEN=${O2_AUTH_TOKEN}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - nginx_logs:/var/log/nginx:ro
      - logs_volume:/app/logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - openobserve
    networks:
      - observability
    logging: *default-logging
    <<: *security-defaults

volumes:
  pgdata:
  static_volume:
  media_volume:
  logs_volume:
  frontend_dist:
  frontend_node_modules:
  nginx_logs:
  o2_data:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
  observability:
    driver: bridge